[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp-auth"
version = "0.1.0"
description = "Login de Garmin Connect, una vez, para el secreto GARMIN_OAUTH1 del Worker"
requires-python = ">=3.10"
# La misma version de garth cuyo intercambio OAuth1 -> OAuth2 replica src/garmin.ts.
dependencies = ["garth==0.8.0"]

[project.scripts]
garmin-mcp-auth = "garmin_mcp_auth:main"

[tool.hatch.build.targets.wheel]
only-include = ["garmin_mcp_auth.py"]
