[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp-auth"
version = "0.1.0"
description = "Login de Garmin Connect, una vez: guarda los tokens DI OAuth2 en ~/.garminconnect"
requires-python = ">=3.10"
# Version fija: el login de Garmin cambia a menudo y cada version sigue al servidor.
dependencies = ["garminconnect==0.3.17"]

[project.scripts]
garmin-mcp-auth = "garmin_mcp_auth:main"

[tool.hatch.build.targets.wheel]
only-include = ["garmin_mcp_auth.py"]
